097,"__typename":3058},{"data":3098,"content":3099,"nodeType":3057},{},[3100],{"data":3101,"content":3102,"nodeType":3056},{},[3103],{"data":3104,"marks":3105,"value":3106,"nodeType":3055},{},[],"레이스를 위한 스피드, 매일 신어도 끄떡없는 내구성. 충격 흡수력과 반발력을 극대화한 슈퍼폼을 탑재해, 스피드 훈련부터 장거리 러닝까지 즐겁고 역동적인 추진력을 경험할 수 있습니다.",{"valueRichText":3108},{"json":3109,"__typename":3058},{"data":3110,"content":3111,"nodeType":3057},{},[3112,3119],{"data":3113,"content":3114,"nodeType":3056},{},[3115],{"data":3116,"marks":3117,"value":3118,"nodeType":3055},{},[],"지구력과 트레일 감각을 키워주는 베이스 러닝. 익숙한 트레일에서는 꾸준한 페이스와 안정적인 리듬 유지가 중요합니다.",{"data":3120,"content":3121,"nodeType":3056},{},[3122],{"data":3123,"marks":3124,"value":3125,"nodeType":3055},{},[],"부드러운 주행감과 보호 기능을 갖춘 러닝화를 만나보세요.",{"valueRichText":3127},{"json":3128,"__typename":3058},{"data":3129,"content":3130,"nodeType":3057},{},[3131,3138,3145,3152,3159,3166],{"nodeType":3056,"data":3132,"content":3133},{},[3134],{"nodeType":3055,"data":3135,"marks":3136,"value":3137},{},[],"On의 모든 러닝화는 설계에 따라 고유한 주행감을 선사합니다.",{"nodeType":3056,"data":3139,"content":3140},{},[3141],{"nodeType":3055,"data":3142,"marks":3143,"value":3144},{},[],"부드러운: 물 흐르듯 매끄러운 주행감을 경험해 보세요. 트레일의 진동과 충격을 완화하도록 설계되어, 장시간 러닝에도 편안함을 유지해 줍니다.",{"nodeType":3056,"data":3146,"content":3147},{},[3148],{"nodeType":3055,"data":3149,"marks":3150,"value":3151},{},[],"반발력 있는: 반응성 좋은 쿠셔닝이 선사하는 에너지 리턴을 경험해 보세요. 반발력을 극대화해 험준한 지형에서도 페이스를 끌어올릴 수 있도록 설계되었습니다.",{"nodeType":3056,"data":3153,"content":3154},{},[3155],{"nodeType":3055,"data":3156,"marks":3157,"value":3158},{},[],"추진력 있는: 강력한 추진력이 선사하는 스피드를 경험해 보세요. 가볍고 민첩한 설계로 고강도 러닝에서도 빠른 페이스를 유지할 수 있도록 도와줍니다.",{"nodeType":3056,"data":3160,"content":3161},{},[3162],{"nodeType":3055,"data":3163,"marks":3164,"value":3165},{},[],"민첩한: 지면과 가까운 민첩한 주행감으로 정교한 움직임을 경험해 보세요. 빠른 풋워크를 지원해, 급격한 방향 전환과 테크니컬한 구간에도 손쉽게 대응할 수 있습니다.",{"nodeType":3056,"data":3167,"content":3168},{},[3169],{"nodeType":3055,"data":3170,"marks":3171,"value":3172},{},[],"유연한: 유연하고 직관적인 주행감이 선사하는 자신감을 경험해 보세요. 거친 지형에도 자연스럽게 대응하며, 변화무쌍한 트레일에서도 안정적인 러닝을 지원합니다.",{"valueRichText":3174},{"json":3175,"__typename":3058},{"data":3176,"content":3177,"nodeType":3057},{},[3178,3185],{"data":3179,"content":3180,"nodeType":3056},{},[3181],{"data":3182,"marks":3183,"value":3184,"nodeType":3055},{},[],"의지와 지구력의 한계를 넘어서는 초장거리 트레일 러닝. 장시간 이어지는 러닝에서 누적 피로를 줄여줄 뛰어난 충격 흡수력이 필요합니다.",{"data":3186,"content":3187,"nodeType":3056},{},[3188],{"data":3189,"marks":3190,"value":3191,"nodeType":3055},{},[],"강력한 쿠셔닝과 흔들림 없는 안정성을 갖춘 러닝화를 만나보세요.",{"valueRichText":3193},{"json":3194,"__typename":3058},{"data":3195,"content":3196,"nodeType":3057},{},[3197,3204],{"data":3198,"content":3199,"nodeType":3056},{},[3200],{"data":3201,"marks":3202,"value":3203,"nodeType":3055},{},[],"민첩성과 지면 감각이 중요한 단거리 트레일 러닝. 테크니컬한 지형에서도 빠르고 정확한 발놀림을 지원합니다.",{"data":3205,"content":3206,"nodeType":3056},{},[3207],{"data":3208,"marks":3209,"value":3210,"nodeType":3055},{},[],"지면과 가까운 설계로 탁월한 반응성을 제공하는 러닝화를 만나보세요.",{"valueRichText":3212},{"json":3213,"__typename":3058},{"data":3214,"content":3215,"nodeType":3057},{},[3216,3223],{"data":3217,"content":3218,"nodeType":3056},{},[3219],{"data":3220,"marks":3221,"value":3222,"nodeType":3055},{},[],"스피드와 지구력이 모두 필요한 장거리 러닝. 거리와 고도가 쌓여갈수록 효율적인 움직임과 안정적인 리듬이 중요합니다.",{"data":3224,"content":3225,"nodeType":3056},{},[3226],{"data":3227,"marks":3228,"value":3229,"nodeType":3055},{},[],"다양한 환경에 유연하게 대응하는 쿠셔닝을 갖춘 러닝화를 만나보세요.",{"valueRichText":3231},{"json":3232,"__typename":3058},{"data":3233,"content":3234,"nodeType":3057},{},[3235,3242],{"data":3236,"content":3237,"nodeType":3056},{},[3238],{"data":3239,"marks":3240,"value":3241,"nodeType":3055},{},[],"정교한 스텝과 페이스 유지가 중요한 고강도 러닝. 모든 발걸음에 자신감을 더해주는 것은 물론,",{"data":3243,"content":3244,"nodeType":3056},{},[3245],{"data":3246,"marks":3247,"value":3248,"nodeType":3055},{},[],"뛰어난 접지력과 탁월한 효율성까지 모두 갖춘 초경량 러닝화를 만나보세요.",{"valueRichText":3250},{"json":3251,"__typename":3058},{"data":3252,"content":3253,"nodeType":3057},{},[3254],{"data":3255,"content":3256,"nodeType":3056},{},[3257],{"data":3258,"marks":3259,"value":3260,"nodeType":3055},{},[],"반발력을 극대화하도록 설계된 초경량 슈퍼폼, Warped™. 강력한 에너지 리턴으로 장거리 러닝에도 피로감을 줄여줍니다.",{"valueRichText":3262},{"json":3263,"__typename":3058},{"data":3264,"content":3265,"nodeType":3057},{},[3266],{"data":3267,"content":3268,"nodeType":3056},{},[3269],{"data":3270,"marks":3271,"value":3272,"nodeType":3055},{},[],"데일리 러닝의 기준을 새롭게 정의하는 Surreal™ 슈퍼폼. 반발력과 충격 흡수력의 완벽한 균형을 구현하며 가벼우면서도 안정적인 지지력을 제공하는 것은 물론, 일반적인 쿠셔닝을 뛰어넘는 초현실적 주행감을 선사합니다.",{"valueRichText":3274},{"json":3275,"__typename":3058},{"data":3276,"content":3277,"nodeType":3057},{},[3278],{"data":3279,"content":3280,"nodeType":3056},{},[3281],{"data":3282,"marks":3283,"value":3284,"nodeType":3055},{},[],"향상된 트레드 패턴과 특수 고무 컴파운드를 결합한 Missiongrip™. 마찰력을 대폭 끌어올려 주는 아웃솔로 어떤 지면에서도 안정적인 그립력과 트랙션을 선사합니다.",{"valueRichText":3286},{"json":3287,"__typename":3058},{"data":3288,"content":3289,"nodeType":3057},{},[3290],{"data":3291,"content":3292,"nodeType":3056},{},[3293],{"data":3294,"marks":3295,"value":3296,"nodeType":3055},{},[],"LightSpray™는 기존의 운동화 제조 공정을 새롭게 재구상해, 우리가 달리는 방식을 완전히 뒤바꾸는 초경량 일체형 어퍼 기술입니다. 단 3분 만의 로봇 공정으로 경이로울 정도로 가벼우면서 거슬림 없는 핏의 일체형 어퍼가 완성됩니다. 그것도 폐기물 및 탄소 배출량을 대폭 줄이면서 말이죠.",{"valueRichText":3298},{"json":3299,"__typename":3058},{"data":3300,"content":3301,"nodeType":3057},{},[3302],{"data":3303,"content":3304,"nodeType":3056},{},[3305],{"data":3306,"marks":3307,"value":3308,"nodeType":3055},{},[],"CloudTec Sphere™는 압축과 복원을 반복하는 특수 채널 구조로 이루어진 구조적 쿠셔닝 시스템입니다. 궁극의 스피드, 지속적인 쿠셔닝, 놀라운 반발력과 더불어 매끄러운 주행감을 경험할 수 있습니다.",{"valueRichText":3310},{"json":3311,"__typename":3058},{"data":3312,"content":3313,"nodeType":3057},{},[3314],{"data":3315,"content":3316,"nodeType":3056},{},[3317],{"data":3318,"marks":3319,"value":3320,"nodeType":3055},{},[],"CloudTec Phase™는 컴퓨터 시뮬레이션을 기반으로 설계된 구조적 쿠셔닝 시스템입니다. 도미노처럼 순차적으로 압축되는 Cloud 엘리먼트가 착지부터 도약까지 자연스러운 무게 중심 전환을 구현합니다.",{"valueRichText":3322},{"json":3323,"__typename":3058},{"data":3324,"content":3325,"nodeType":3057},{},[3326],{"data":3327,"content":3328,"nodeType":3056},{},[3329],{"data":3330,"marks":3331,"value":3332,"nodeType":3055},{},[],"구조적 쿠셔닝 시스템, CloudTec®. 용도에 따라 맞춤 설계된 특수 폼이 러너 개개인의 필요에 꼭 맞는 주행감을 구현합니다.",{"valueRichText":3334},{"json":3335,"__typename":3058},{"data":3336,"content":3337,"nodeType":3057},{},[3338],{"data":3339,"content":3340,"nodeType":3056},{},[3341],{"data":3342,"marks":3343,"value":3344,"nodeType":3055},{},[],"러닝 효율을 극대화하도록 설계된 초경량 하이퍼폼, Helion™ HF. 반발력과 반응성에 최적화된 특수 소재로 제작되어 강력한 에너지 리턴을 선사합니다. 덕분에 달리는 모든 순간 힘들이지 않고도 파워풀한 속도감을 느낄 수 있죠.",{"valueRichText":3346},{"json":3347,"__typename":3058},{"data":3348,"content":3349,"nodeType":3057},{},[3350],{"data":3351,"content":3352,"nodeType":3056},{},[3353],{"data":3354,"marks":3355,"value":3356,"nodeType":3055},{},[],"한층 향상된 추진력과 러닝 효율을 위해 설계된 Speedboard®. 발 앞부분의 플레이트가 구부러지면서 에너지를 저장했다가 지면을 밀어내는 순간 이를 강력한 도약으로 전환해 줍니다. 더 적은 힘으로 더 빠른 속도감을 느낄 수 있다는 의미죠.",{"valueRichText":3358},{"json":3359,"__typename":3058},{"data":3360,"content":3361,"nodeType":3057},{},[3362],{"data":3363,"content":3364,"nodeType":3056},{},[3365],{"data":3366,"marks":3367,"value":3368,"nodeType":3055},{},[],"어떤 러닝에도 뛰어난 지지력을 제공하는 Helion™ 폼. 달리는 매 순간 편안함과 안정감을 선사합니다.",{"valueRichText":3370},{"json":3371,"__typename":3058},{"data":3372,"content":3373,"nodeType":3057},{},[3374,3381,3388,3395],{"data":3375,"content":3376,"nodeType":3056},{},[3377],{"data":3378,"marks":3379,"value":3380,"nodeType":3055},{},[],"잘 맞는 스포츠 브라를 찾으려면 활동에 적합한 서포트 레벨을 선택하는 것이 중요합니다.  ",{"data":3382,"content":3383,"nodeType":3056},{},[3384],{"data":3385,"marks":3386,"value":3387,"nodeType":3055},{},[],"낮음: 조이는 부분 없이 가슴을 편안하게 받쳐줍니다. 걷기, 사이클링, 느긋한 산책과 같이 가벼운 운동에 적합합니다. ",{"data":3389,"content":3390,"nodeType":3056},{},[3391],{"data":3392,"marks":3393,"value":3394,"nodeType":3055},{},[],"중간: 요가나 필라테스 등 저강도 운동에 적합합니다. 가슴을 어느 정도 탄탄하게 받쳐주고 움직임에 맞춰 자연스럽게 움직이게 합니다.  ",{"data":3396,"content":3397,"nodeType":3056},{},[3398],{"data":3399,"marks":3400,"value":3401,"nodeType":3055},{},[],"높음: 얇은 패딩이 들어가서 가슴을 탄탄하게 받쳐줍니다. 스프린트, HIIT 등 강하게 점프하는 운동에 적합합니다.",{"valueRichText":3403},{"json":3404,"__typename":3058},{"nodeType":3057,"data":3405,"content":3406},{},[3407,3414,3421,3428,3435],{"nodeType":3056,"data":3408,"content":3409},{},[3410],{"nodeType":3055,"value":3411,"marks":3412,"data":3413},"The type of environment a shoe is engineered for. ",[],{},{"nodeType":3056,"data":3415,"content":3416},{},[3417],{"nodeType":3055,"value":3418,"marks":3419,"data":3420},"Non-technical terrain: Light and agile, these shoes are built to maintain a fluid flow on predictable surfaces like hard-packed dirt and well-maintained trails.",[],{},{"nodeType":3056,"data":3422,"content":3423},{},[3424],{"nodeType":3055,"value":3425,"marks":3426,"data":3427},"All terrain: These road-to-trail hybrids handle pavements with ease before providing the necessary grip for gravel paths and woodland tracks.",[],{},{"nodeType":3056,"data":3429,"content":3430},{},[3431],{"nodeType":3055,"value":3432,"marks":3433,"data":3434},"Mixed terrain: Built for the unpredictable, these shoes deliver reliable traction in changing conditions – from soft forest floors to rocky trails.",[],{},{"nodeType":3056,"data":3436,"content":3437},{},[3438],{"nodeType":3055,"value":3439,"marks":3440,"data":3441},"Technical terrain: With maximum grip and reinforced protection, these shoes are made for the most demanding environments, including jagged rocks and steep, rugged climbs.",[],{},{"valueRichText":3443},{"json":3444,"__typename":3058},{"data":3445,"content":3446,"nodeType":3057},{},[3447],{"data":3448,"content":3449,"nodeType":3056},{},[3450],{"data":3451,"content":3453,"nodeType":3457},{"uri":3452},"/shop/womens",[3454],{"data":3455,"marks":3456,"value":285,"nodeType":3055},{},[],"hyperlink",{"valueRichText":3459},{"json":3460,"__typename":3058},{"data":3461,"content":3462,"nodeType":3057},{},[3463],{"data":3464,"content":3465,"nodeType":3056},{},[3466,3470,3478],{"da 0,"value":3826,"nodeType":3055},{},[],{"valueRichText":3882},{"json":3883,"__typename":3058},{"data":3884,"content":3885,"nodeType":3057},{},[3886,3893],{"data":3887,"content":3888,"nodeType":3056},{},[3889],{"data":3890,"marks":3891,"value":3892,"nodeType":3055},{},[],"스피드와 지구력이 동시에 요구되는 거리, 코너와 직선 구간 모두에서 페이스를 유지하는 것이 핵심입니다.",{"data":3894,"content":3895,"nodeType":3056},{},[3896],{"data":3897,"marks":3898,"value":3899,"nodeType":3055},{},[],"안정적인 트랙션과 반응성을 모두 갖춘 러닝화를 찾아보세요.",{"valueRichText":3901},{"json":3902,"__typename":3058},{"data":3903,"content":3904,"nodeType":3057},{},[3905],{"data":3906,"content":3907,"nodeType":3056},{},[3908],{"data":3909,"marks":3910,"value":3911,"nodeType":3055},{},[],"스피드를 위한 정밀 설계. 가볍고 민첩하며 역동적인 레이싱화로, 반발력과 효율성을 극대화한 슈퍼폼과 추진력을 더해주는 Speedboard®를 탑재했습니다. 찰나의 순간, 한계를 뛰어넘는 퍼포먼스를 발휘하세요.",{"valueRichText":3913},{"json":3914,"__typename":3058},{"data":3915,"content":3916,"nodeType":3057},{},[3917],{"data":3918,"content":3919,"nodeType":3056},{},[3920],{"data":3921,"marks":3922,"value":3923,"nodeType":3055},{},[],"가장 많이 신게 되는 러닝화. 뛰어난 내구성과 활용성, 한결같은 편안함으로 회복 러닝부터 꾸준한 훈련까지 언제든 믿고 신을 수 있습니다.",{"valueRichText":3925},{"json":3926,"__typename":3058},{"data":3927,"content":3928,"nodeType":3057},{},[3929,3936],{"data":3930,"content":3931,"nodeType":3056},{},[3932],{"data":3933,"marks":3934,"value":3935,"nodeType":3055},{},[],"단거리부터 중거리까지, 폭발적인 스피드와 정교한 기술로 0.1초의 찰나를 다투는 레이스.",{"data":3937,"content":3938,"nodeType":3056},{},[3939],{"data":3940,"marks":3941,"value":3942,"nodeType":3055},{},[],"단단한 지지력으로 강력한 추진력을 제공하는 트랙 스파이크화를 찾아보세요.",{"valueRichText":3944},{"json":3945,"__typename":3058},{"data":3946,"content":3947,"nodeType":3057},{},[3948,3955],{"data":3949,"content":3950,"nodeType":3056},{},[3951],{"data":3952,"marks":3953,"value":3954,"nodeType":3055},{},[],"첫걸음부터 마지막 스퍼트까지, 빠른 페이스와 민첩한 발놀림이 요구되는 레이스. ",{"data":3956,"content":3957,"nodeType":3056},{},[3958],{"data":3959,"marks":3960,"value":3961,"nodeType":3055},{},[],"고강도 러닝에 최척화된 가벼운 러닝화를 선택하 이스를 유지하려면 러닝 효율성, 페이스 조절, 그리고 끝없는 집중력이 필요합니다.",{"data":4051,"content":4052,"nodeType":3056},{},[4053],{"data":4054,"marks":4055,"value":4056,"nodeType":3055},{},[],"레이스 내내 페이스를 지켜줄 반발력 좋은 러닝화를 찾아보세요.",{"valueRichText":4058},{"json":4059,"__typename":3058},{"data":4060,"content":4061,"nodeType":3057},{},[4062,4069],{"data":4063,"content":4064,"nodeType":3056},{},[4065],{"data":4066,"marks":4067,"value":4068,"nodeType":3055},{},[],"극한의 거리, 예측할 수 없는 환경. 그 모든 것을 넘어서는 레이스.  나만의 리듬을 찾는 것이 핵심입니다.",{"data":4070,"content":4071,"nodeType":3056},{},[4072],{"data":4073,"marks":4074,"value":4075,"nodeType":3055},{},[],"장거리 효율성과 안정적인 쿠셔닝을 갖춘 러닝화를 찾아보세요.",{"valueRichText":4077},{"json":4078,"__typename":3058},{"data":4079,"content":4080,"nodeType":3057},{},[4081,4088],{"data":4082,"content":4083,"nodeType":3056},{},[4084],{"data":4085,"marks":4086,"value":4087,"nodeType":3055},{},[],"더 빠른 페이스로 더 오래 달릴 수 있도록 몸과 마음을 단련하는, 힘들지만 기분 좋은 고강도 훈련.",{"data":4089,"content":4090,"nodeType":3056},{},[4091],{"data":4092,"marks":4093,"value":4094,"nodeType":3055},{},[],"강도 높은 훈련에 최적화된 반응성과 추진력을 갖춘 러닝화를 찾아보세요.",{"valueRichText":4096},{"json":4097,"__typename":3058},{"data":4098,"content":4099,"nodeType":3057},{},[4100],{"data":4101,"content":4102,"nodeType":3056},{},[4103],{"data":4104,"marks":4105,"value":4106,"nodeType":3055},{},[],"신발이 지면을 박차고 나갈 때 느껴지는 탄성과 반발력의 정도.",{"valueRichText":4108},{"json":4109,"__typename":3058},{"data":4110,"content":4111,"nodeType":3057},{},[4112,4119,4126,4133],{"data":4113,"content":4114,"nodeType":3056},{},[4115],{"data":4116,"marks":4117,"value":4118,"nodeType":3055},{},[],"퍼포먼스를 한 단계 끌어 올려주는 스파이크화에 대해 알아볼까요? 스파이크화는 길이가 다양한 스파이크가 장착되어 거리나 지면 상태에 관계없이 뛰어난 접지력을 발휘합니다.",{"data":4120,"content":4121,"nodeType":3056},{},[4122],{"data":4123,"marks":4124,"value":4125,"nodeType":3055},{},[],"중거리용 스파이크화는 정교함, 디자인, 기능성을 적절히 결합해 800m~1,500m 트랙 경기에 적합합니다.",{"data":4127,"content":4128,"nodeType":3056},{},[4129],{"data":4130,"marks":4131,"value":4132,"nodeType":3055},{},[],"장거리용 스파이크화는 가벼운 착용감과 최적의 접지력을 제공하며 5,000m~10,000m 경기에 이상적입니다.",{"data":4134,"content":4135,"nodeType":3056},{},[4136],{"data":4137,"marks":4138,"value":4139,"nodeType":3055},{},[],"가장 험난한 크로스컨트리 환경에 맞춰 그립력과 트랙션을 최적화하여 진흙탕 속에서도 탁월한 민첩한 반응성을 선보입니다.",{"valueRichText":4141},{"json":4142,"__typename":3058},{"data":4143,"content":4144,"nodeType":3057},{},[4145,4152,4159],{"data":4146,"content":4147,"nodeType":3056},{},[4148],{"data":4149,"marks":4150,"value":4151,"nodeType":3055},{},[],"방수성: 통기성을 타협하지 않으면서도 물을 막아주는 삼중 레이어 멤브레인 기술이 On 제품 중 가장 높은 수준의 보호 기능을 제공합니다. ",{"data":4153,"content":4154,"nodeType":3056},{},[4155],{"data":4156,"marks":4157,"value":4158,"nodeType":3055},{},[],"발수성: 내구성 높은 발수(DWR) 표면 처리로 빗방울을 튕겨 내며, 옷감에 물이 스며들지 않습니다. 덕분에 쾌적하고 편안한 착용감을 느낄 수 있습니다.",{"data":4160,"content":4161,"nodeType":3056},{},[4162],{"data":4163,"marks":4164,"value":4165,"nodeType":3055},{},[],"내수성: 가장 가벼운 보호 옵션. 가볍고 거추장스럽지 않아 온종일 지속되는 편안함을 제공합니다. ",{"valueRichText":4167},{"json":4168,"__typename":3058},{"data":4169,"content":4170,"nodeType":3057},{},[4171,4178,4185,4192],{"data":4172,"content":4173,"nodeType":3056},{},[4174],{"data":4175,"marks":4176,"value":4177,"nodeType":3055},{},[],"신발의 쿠셔닝 수준은 착지 시 지면에 발이 닿는 느낌을 결정합니다.",{"data":4179,"content":4180,"nodeType":3056},{},[4181],{"data":4182,"marks":4183,"value":4184,"nodeType":3055},{},[],"로우 쿠셔닝: 스피드를 위한 탄생. 지면에 가까운 설계로 가볍고 민첩한 주행감.",{"data":4186,"content":4187,"nodeType":3056},{},[4188],{"data":4189,"marks":4190,"value":4191,"nodeType":3055},{},[],"미드 쿠셔닝: 완벽한 균형감. 부드러운 착지와 탄성감 있는 도약의 결합으로 높은 활용성.",{"data":4193,"content":4194,"nodeType":3056},{},[4195],{"data":4196,"marks":4197,"value":4198,"nodeType":3055},{},[],"맥스 쿠셔닝: 차원이 다른 푹신함. 극강의 충격 흡수력으로 정말 부드럽고 편안한 착화감.",{"valueRichText":4200},{"json":4201,"__typename":3058},{"data":4202,"content":4203,"nodeType":3057},{},[4204,4211,4218],{"data":4205,"content":4206,"nodeType":3056},{},[4207],{"data":4208,"marks":4209,"value":4210,"nodeType":3055},{},[],"추운 날씨: 스위스 기술력으로 만들어 추운 날씨에도 따뜻하고 포근하고 편안합니다. 비가 오든 바람이 불든 어떤 모험에도 함께하세요. ",{"data":4212,"content":4213,"nodeType":3056},{},[4214],{"data":4215,"marks":4216,"value":4217,"nodeType":3055},{},[],"모든 날씨: On 용품은 어떤 날씨에도 거뜬합니다. 단독으로 입어도 좋고 겹쳐 입어도 좋은 On 제품은 대부분 땀을 빠르게 발산하고 체온을 유지해 줍니다. 모두가 꿈꾸던 제품이죠.  ",{"data":4219,"content":4220,"nodeType":3056},{},[4221],{"data":4222,"marks":4223,"value":4224,"nodeType":3055},{},[],"따뜻한 날씨: 땀을 빠르게 발산하고 가벼워서 더운 날씨에도 쾌적함을 선사합니다.",{"valueRichText":4226},{"json":4227,"__typename":3058},{"data":4228,"content":4229,"nodeType":3057},{},[4230,4237,4244,4251],{"data":4231,"content":4232,"nodeType":3056},{},[4233],{"data":4234,"marks":4235,"value":4236,"nodeType":3055},{},[],"신발의 안정성이야말로 운동 효과를 높이는 핵심입니다. 실제로 적정한 지지력을 갖춘 신발은 운동의 질을 크게 좌우할 수 있죠.",{"data":4238,"content":4239,"nodeType":3056},{},[4240],{"data":4241,"marks":4242,"value":4243,"nodeType":3055},{},[],"서킷 트레이닝, 러닝머신 달리기, 맨몸 운동, 스튜디오 세션 등의 다양한 운동부터 일상생활까지 폭넓게 활용하기 위한 용도라면 가벼운 안정성을 갖춘 신발을 선택하는 것이 좋습니다.",{"data":4245,"content":4246,"nodeType":3056},{},[4247],{"data":4248,"marks":4249,"value":4250,"nodeType":3055},{},[],"반면 중간 정도의 안정성을 갖춘 신발의 경우, 지지력과 유연성을 적절히 조합하여 역동적인 움직임, 고강도 인터벌 트레이닝(HIIT)을 비롯해 다양한 트레이닝에서 운동 능력을 높여줍니다.",{"data":4252,"content":4253,"nodeType":3056},{},[4254],{"data":4255,"marks":4256,"value":4257,"nodeType":3055},{},[],"마지막으로 높은 안정성을 갖춘 신발은 운동 강도에 상관없이 발을 단단히 고정해 주는 견고한 지지력을 지녔기 때문에 웨이트리프팅, 크로스 트레이닝, 근력 운동 등에 적합합니다.",{"valueRichText":4259},{"json":4260,"__typename":3058},{"data":4261,"content":4262,"nodeType":3057},{},[4263,4270,4277,4284,4305],{"data":4264,"content":4265,"nodeType":3056},{},[4266],{"data":4267,"marks":4268,"value":4269,"nodeType":3055},{},[],"스피드 슈레이스 시스템: 묶고 풀지 않아도 되는 신축성 있는 신발 끈을 적용해 쉽고 빠르게 신고 벗을 수 있습니다. 팁: 보다 타이트한 핏을 원한다면 양 끝의 매듭을 다시 묶어 사용하세요. ",{"data":4271,"content":4272,"nodeType":3056},{},[4273],{"data":4274,"marks":4275,"value":4276,"nodeType":3055},{},[],"표준 슈레이스 시스템: 일반적인 신발 끈을 적용해 발을 단단히 잡아 줍니다.",{"data":4278,"content":4279,"nodeType":3056},{},[4280],{"data":4281,"marks":4282,"value":4283,"nodeType":3055},{},[],"벨크로 타입: On 신발의 파워스트랩을 고정하는 데 사용됩니다. 스트랩을 간단히 붙였다 떼었다 하는 벨크로 방식의 신발 끈입니다.",{"data":4285,"content":4286,"nodeType":3056},{},[4287,4291,4301],{"data":4288,"marks":4289,"value":4290,"nodeType":3055},{},[],"스타형 슈레이스 시스템: 별이 교차하는 형태의 슈레이스로 안정성과 지지력을 강화해 착화감이 보다 안정적입니다. ",{"data":4292,"content":4294,"nodeType":3457},{"uri":4293},"/stories/the-6-best-ways-to-lace-your-running-shoes",[4295],{"data":4296,"marks":4297,"value":4300,"nodeType":3055},{},[4298],{"type":4299},"underline","이 글",{"data":4302,"marks":4303,"value":4304,"nodeType":3055},{},[],"을 통해 더 다양한 신발 끈 연출법을 알아보세요.",{"data":4306,"content":4307,"nodeType":3056},{},[4308],{"data":4309,"marks":4310,"value":4311,"nodeType":3055},{},[],"레이스리스: 신자마자 발모양에 맞게 밀착되는 슬립온 타입.\n",{"valueRichText":4313},{"json":4314,"__typename":3058},{"data":4315,"content":4316,"nodeType":3057},{},[4317,4324,4331,4342],{"data":4318,"content":4319,"nodeType":3056},{},[4320],{"data":4321,"marks":4322,"value":4323,"nodeType":3055},{},[],"On은 원하는 아웃도어 활동에 따라 적합한 제품을 선택하실 수 있도록 하이킹 신발을 세 가지 카테고리로 분류하고 있습니다.",{"data":4325,"content":4326,"nodeType":3056},{},[4327],{"data":4328,"marks":4329,"value":4330,"nodeType":3055},{},[],"다기능: 산악 지역부터 도심까지 다양한 지면에서 사용하기에 적합합니다.  ",{"data":4332,"content":4333,"nodeType":3056},{},[4334,4338],{"data":4335,"marks":4336,"value":4337,"nodeType":3055},{},[],"다기능성",{"data":4339,"marks":4340,"value":4341,"nodeType":3055},{},[],": 간단한 장비만을 갖추고 떠나는 당일치기 하이킹에 적합합니다.",{"data":4343,"content":4344,"nodeType":3056},{},[4345],{"data":4346,"marks":4347,"value":4348,"nodeType":3055},{},[],"트레킹: 장비를 갖추고 떠나는 1박 이상의 트레킹에 적합합니다. ",{"valueRichText":4350},{"json":4351,"__typename":3058},{"data":4352,"content":4353,"nodeType":3057},{},[4354,4361,4368,4375,4382],{"data":4355,"content":4356,"nodeType":3056},{},[4357],{"data":4358,"marks":4359,"value":4360,"nodeType":3055},{},[],"On 러닝화는 디자인에 따라 각기 다른 주행감을 선사합니다.",{"data":4362,"content":4363,"nodeType":3056},{},[4364],{"data":4365,"marks":4366,"value":4367,
